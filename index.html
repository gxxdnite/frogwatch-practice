<!DOCTYPE html>
<!--
SHARED CHAPTERS SETUP (one time, free). Without it the app still works, but chapters stay on this device.
1. Go to console.firebase.google.com and add a project (Analytics can be off).
2. Build > Realtime Database > Create database (locked mode is fine).
3. Build > Authentication > Get started > Sign-in method > Anonymous > Enable.
4. Realtime Database > Rules tab: replace everything with the rules below, then Publish.
5. Project settings (gear) > General: copy the Web API key (add a web app with the </> icon if none exists).
   Realtime Database > Data tab: copy the database URL.
6. Paste both into FB_URL and FB_KEY near the top of the script below.

RULES:
{
 "rules": {
  "directory": {
   ".read": true,
   "$cid": {
    ".write": "auth != null && (!data.exists() || data.child('owner').val() === auth.uid)",
    ".validate": "!newData.exists() || newData.child('owner').val() === auth.uid"
   }
  },
  "chapters": {
   "$cid": {
    ".read": "auth != null && (root.child('directory/'+$cid+'/access').val() === 'public' || root.child('directory/'+$cid+'/owner').val() === auth.uid || root.child('members/'+$cid+'/'+auth.uid).val() === true)",
    ".write": "auth != null && root.child('directory/'+$cid+'/owner').val() === auth.uid"
   }
  },
  "members": {
   "$cid": {
    ".write": "auth != null && root.child('directory/'+$cid+'/owner').val() === auth.uid"
   }
  },
  "requests": {
   "$cid": {
    ".read": "auth != null && root.child('directory/'+$cid+'/owner').val() === auth.uid",
    ".write": "auth != null && root.child('directory/'+$cid+'/owner').val() === auth.uid",
    "$uid": {
     ".read": "auth != null && $uid === auth.uid",
     ".write": "auth != null && $uid === auth.uid"
    }
   }
  }
 }
}
-->
<html lang="en">

<style>

<body>
<div class="wrap" id="app"></div>
<script>
(() => {
const API = "https://api.inaturalist.org/v1", AMPH = 20978, KEY = "frogTrainerV1";
const app = document.getElementById("app");

// ---- tiny DOM helper ----
const h = (t, a = {}, ...k) => {
  const e = document.createElement(t);
  for (const [x, v] of Object.entries(a)) {
    if (x === "class") e.className = v;
    else if (x === "value") e.value = v;
    else if (x.startsWith("on")) e.addEventListener(x.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(x, v === true ? "" : v);
  }
  k.flat(9).forEach((c) => e.append(c instanceof Node ? c : document.createTextNode(c == null ? "" : c)));
  return e;
};
// replaceChildren that also accepts arrays (lists of elements) and skips empty values
const _rc = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...k) { return _rc.apply(this, k.flat(9).filter((c) => c !== "" && c != null && c !== false)); };
const uid = () => Math.random().toString(36).slice(2, 9);
const sf = async (u) => { const r = await fetch(u); if (!r.ok) throw Error("iNaturalist returned " + r.status); return r.json(); };
const deb = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const shuf = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
const lab = (s) => s.common || s.name || s.q;

// ---- shared chapters (Firebase). Fill these in; see setup notes at the top of the file ----
const FB_URL = "https://frogwatch-practice-default-rtdb.firebaseio.com";   // e.g. https://your-project-default-rtdb.firebaseio.com
const FB_KEY = "AIzaSyDfglPkl01VIP0brl6nasfsQKmnBdAqeoQ";   // Web API key from Firebase project settings
const SHARED = !!(FB_URL && FB_KEY);
let tok = null;
async function auth() {
  if (tok && tok.exp > Date.now() + 60000) return tok;
  let st = null; try { st = JSON.parse(localStorage.getItem("frogAuth")); } catch (e) {}
  let r = null;
  if (st && st.refresh) {
    try {
      const j = await (await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_KEY}`, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(st.refresh) })).json();
      if (j.id_token) r = { idToken: j.id_token, refreshToken: j.refresh_token, localId: j.user_id, expiresIn: j.expires_in };
    } catch (e) {}
  }
  if (!r) r = await (await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_KEY}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ returnSecureToken: true }) })).json();
  if (!r.idToken) throw Error("Sign-in failed: " + ((r.error && r.error.message) || "no response"));
  tok = { id: r.idToken, uid: r.localId, exp: Date.now() + Number(r.expiresIn) * 1000 };
  try { localStorage.setItem("frogAuth", JSON.stringify({ refresh: r.refreshToken })); } catch (e) {}
  return tok;
}
async function db(method, path, body) {
  const t = await auth();
  const res = await fetch(`${FB_URL.replace(/\/$/, "")}/${path}.json?auth=${t.id}`, { method, body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.status === 401 || res.status === 403) throw Error("denied");
  if (!res.ok) throw Error("Database returned " + res.status);
  return res.json();
}
async function publish(c) {
  await fix();
  const t = await auth(), cid = c.share.cid || (c.share.cid = uid() + uid());
  const { share, ...rest } = c;
  await db("PUT", `directory/${cid}`, { name: c.name || "Untitled", host: c.host || "", area: areaText(c), access: c.share.access, owner: t.uid, n: c.species.length, at: Date.now() });
  await db("PUT", `chapters/${cid}`, { json: JSON.stringify({ chapter: rest, presets: D.presets, subs: D.subs }) });
  lsave();
}
function explain(e) {
  const m = (e && e.message) || "";
  if (m === "denied") return "Firebase rejected the request. Check that the rules were pasted and published (Realtime Database > Rules).";
  if (/CONFIGURATION_NOT_FOUND|OPERATION_NOT_ALLOWED|ADMIN_ONLY_OPERATION/.test(m)) return "Anonymous sign-in isn't enabled. In Firebase go to Build > Authentication > Get started > Sign-in method > Anonymous > Enable.";
  if (/API_KEY|API key|INVALID_KEY/i.test(m)) return "The Web API key looks wrong. Re-copy it from Project settings > General.";
  if (/404/.test(m)) return "The database URL looks wrong. Copy it again from the Realtime Database Data tab.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Couldn't connect. Check your internet and that FB_URL starts with https:// and has no extra spaces.";
  return m || "unknown error";
}
async function unshare(cid) { for (const k of ["chapters", "members", "requests", "directory"]) await db("DELETE", `${k}/${cid}`); }

// ---- STARTER DATA (edit here, or just use the in-app editors) ----
// Species are written by common name; the app looks up the iNaturalist IDs itself.
const S = (...n) => n.map((q) => ({ id: null, q }));
const SEED = {
  presets: [
    { id: "p1", name: "Gray treefrogs", callType: "Fast pulsed trill", species: S("Cope's Gray Treefrog", "Eastern Gray Treefrog") },
    { id: "p2", name: "Peeper & chorus frogs", callType: "High peeps and rising trills", species: S("Spring Peeper", "Upland Chorus Frog", "Southern Chorus Frog") },
    { id: "p3", name: "Trilling toads", callType: "Long, steady musical trill", species: S("American Toad", "Fowler's Toad", "Southern Toad") },
    { id: "p4", name: "Leopard & pickerel", callType: "Chuckles, clucks and snores", species: S("Southern Leopard Frog", "Pickerel Frog") },
    { id: "p5", name: "Big green twangs", callType: "Deep twangs and grunts", species: S("American Bullfrog", "Green Frog", "Pig Frog") },
  ],
  subs: [
    { id: "s1", main: "p2", name: "Alabama chorus frogs", places: [{ name: "Alabama" }], custom: [], tags: "trill, late winter", species: S("Upland Chorus Frog", "Southern Chorus Frog") },
  ],
  chapters: [
    { id: "c1", name: "Example FrogWatchUSA chapter (edit me)", host: "Your zoo, aquarium, or partner organization", coordinator: "", notes: "", places: [{ name: "Alabama" }], custom: [],
      species: S("Spring Peeper", "Cope's Gray Treefrog", "Green Treefrog", "Squirrel Treefrog", "Pine Woods Treefrog", "Barking Treefrog", "Southern Leopard Frog", "American Bullfrog", "Green Frog", "Southern Toad", "Fowler's Toad", "Eastern Narrow-mouthed Toad", "Upland Chorus Frog", "Southern Chorus Frog") },
  ],
};

// ---- saved data (lives in this browser) ----
let D;
try { D = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!D || !D.presets || !D.chapters) D = structuredClone(SEED);
if (!D.subs) D.subs = [];
const shape = () => {
D.chapters.forEach((c) => { c.places = c.places || (c.place ? [c.place] : []); delete c.place; c.custom = (c.custom || []).map((q) => (typeof q === "string" ? { name: q } : q)); c.host = c.host || ""; c.coordinator = c.coordinator || ""; c.notes = c.notes || ""; });
D.subs.forEach((x) => { x.places = x.places || (x.place ? [x.place] : []); delete x.place; x.custom = (x.custom || []).map((c) => (typeof c === "string" ? { name: c } : c)); });
};
shape();
const lsave = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} };
let pushT;
const save = () => {
  lsave();
  if (SHARED && chapter && chapter.share && chapter.share.cid && cur === editChapter) { clearTimeout(pushT); pushT = setTimeout(() => publish(chapter).catch(() => {}), 2000); }
};

// ---- look up IDs for starter species / places ----
async function resolve(list) {
  let ch = false;
  for (const s of list) {
    if (s.id) continue;
    try {
      const r = (await sf(`${API}/taxa?q=${encodeURIComponent(s.q)}&rank=species&is_active=true&taxon_id=${AMPH}&per_page=5`)).results || [];
      const t = r.find((t) => norm(t.preferred_common_name) === norm(s.q) || norm(t.name) === norm(s.q)) || r[0];
      if (t) { s.id = t.id; s.name = t.name; s.common = t.preferred_common_name || t.name; ch = true; }
    } catch (e) {}
  }
  return ch;
}
async function fixAll() {
  let c = await resolve([...D.presets, ...D.subs, ...D.chapters].flatMap((x) => x.species));
  for (const pl of [...D.chapters.flatMap((x) => x.places), ...D.subs.flatMap((x) => x.places)].filter((p) => p && !p.id)) {
    try {
      const p = ((await sf(`${API}/places/autocomplete?q=${encodeURIComponent(pl.name)}&per_page=1`)).results || [])[0];
      if (p) { pl.id = p.id; pl.name = p.display_name; c = true; }
    } catch (e) {}
  }
  if (c) save();
  return c;
}
let fx = null;
const fix = () => fx || (fx = fixAll().finally(() => { fx = null; }));

// ---- search-as-you-type picker ----
function picker(ph, search, render, pick) {
  const inp = h("input", { type: "text", placeholder: ph }), box = h("div", { style: "display:none" });
  const run = deb(async (q) => {
    if (q.length < 2) { box.style.display = "none"; return; }
    try {
      const r = await search(q);
      box.replaceChildren(...r.map((x) => h("button", { onclick: () => { pick(x); inp.value = ""; box.style.display = "none"; } }, render(x))));
      box.style.display = r.length ? "block" : "none";
    } catch (e) { box.style.display = "none"; }
  }, 300);
  inp.addEventListener("input", () => run(inp.value));
  return h("div", { class: "sug" }, inp, box);
}
document.addEventListener("click", (e) => document.querySelectorAll(".sug>div").forEach((b) => { if (!b.parentNode.contains(e.target)) b.style.display = "none"; }));

const spSearch = async (q) => ((await sf(`${API}/taxa/autocomplete?q=${encodeURIComponent(q)}&taxon_id=${AMPH}&per_page=10&is_active=true`)).results || []).filter((t) => t.rank === "species");
const spRender = (t) => [t.preferred_common_name || t.name, h("i", {}, t.name)];
const toSp = (t) => ({ id: t.id, name: t.name, common: t.preferred_common_name || t.name });
const placeSearch = async (q) => (await sf(`${API}/places/autocomplete?q=${encodeURIComponent(q)}&per_page=8`)).results || [];

// species list editor: chips with × plus an amphibian search box
function spEditor(list, onChange) {
  const chips = h("div", { class: "chips" });
  const draw = () => chips.replaceChildren(...list.map((s, i) =>
    h("span", { class: "chip" }, lab(s), h("span", { class: "x", title: "Remove", onclick: () => { list.splice(i, 1); onChange(); draw(); } }, "×"))));
  draw();
  const el = h("div", {}, chips, picker("Add a species — search by common or scientific name", spSearch, spRender, (t) => {
    if (!list.some((s) => s.id === t.id)) { list.push(toSp(t)); onChange(); draw(); }
  }));
  el.redraw = draw;
  return el;
}

// ---- navigation ----
let ep, tagSel, cur, back, mode, chapter, place, pid, pool, ans = "choice", n = 1, sc = { c: 0, t: 0 }, recent = [], used = new Set(), qn = 0, ui, current;
const go = (f) => { cur = f; f(); window.scrollTo(0, 0); };

function home() {
  app.replaceChildren(
    h("h1", {}, "Frog Call Trainer"),
    h("p", { class: "sub" }, "Practice frog calls with Research Grade recordings from iNaturalist and a mode made for FrogWatchUSA chapters; this is an unofficial tool, not affiliated with FrogWatchUSA or the AZA."),
    h("button", { class: "big", onclick: () => startQuiz("free") }, h("b", {}, "Free Play"), h("span", {}, "General practice with an optional location filter.")),
    h("button", { class: "big", onclick: () => go(chapters) }, h("b", {}, "FrogWatchUSA chapter"), h("span", {}, "Set up or choose your chapter, then only practice local species.")),
    h("div", { class: "row" },
      h("button", { class: "ghost", onclick: () => { back = home; go(presets); } }, "Manage soundalike presets"),
      h("button", { class: "ghost danger", onclick: () => { if (confirm("Replace all chapters and presets with the starter set?")) { D = structuredClone(SEED); save(); home(); fix().then((c) => c && cur === home && home()); } } }, "Reset to starter data")),
  );
}

const areaText = (x) => [...x.places.map((p) => p.name), ...x.custom.map((b) => b.name)].join(", ") || "all locations";
const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = (t) => JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
function importCode(t) {
  const o = dec(t);
  if (!o || !o.chapter) throw Error("bad code");
  o.chapter.id = uid(); D.chapters.push(o.chapter);
  (o.presets || []).forEach((p) => { if (!D.presets.some((x) => x.id === p.id)) D.presets.push(p); });
  (o.subs || []).forEach((p) => { if (!D.subs.some((x) => x.id === p.id)) D.subs.push(p); });
  shape(); save();
}
const taStyle = "width:100%;height:80px;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit";

function mergeBundle(b, cid) {
  const mg = (arr, list) => (arr || []).forEach((p) => { const ex = list.find((y) => y.id === p.id); if (!ex) list.push({ ...p, from: cid }); else if (ex.from === cid) Object.assign(ex, p, { from: cid }); });
  mg(b.presets, D.presets); mg(b.subs, D.subs); shape(); lsave();
}

async function accessForm(m, box) {
  const t = await auth();
  let mine = null; try { mine = await db("GET", `requests/${m.cid}/${t.uid}`); } catch (e) {}
  if (mine) { box.className = "note"; box.textContent = "Your request is pending. Ask the chapter coordinator to approve it, then open the chapter again."; return; }
  const nm = h("input", { type: "text", placeholder: "Your name" }), nt = h("input", { type: "text", placeholder: "Note to the coordinator (optional)" });
  box.className = "";
  box.replaceChildren(h("p", { class: "note" }, "This chapter needs its coordinator's approval."), nm, h("div", { style: "height:6px" }), nt,
    h("button", { class: "btn", style: "margin-top:8px", onclick: async () => {
      if (!nm.value.trim()) return;
      try { await db("PUT", `requests/${m.cid}/${t.uid}`, { name: nm.value.trim().slice(0, 80), note: nt.value.trim().slice(0, 200), at: Date.now() }); box.className = "note"; box.textContent = "Request sent. You can open this chapter once the coordinator approves it."; }
      catch (e) { box.textContent = "Couldn't send the request."; }
    } }, "Request access"));
}

async function openRemote(m, box) {
  box.className = "note"; box.textContent = "Opening…";
  try {
    const t = await auth(), mine = m.owner === t.uid ? D.chapters.find((c) => c.share && c.share.cid === m.cid) : null;
    if (mine) { chapter = mine; startQuiz("chapter"); return; }
    const r = await db("GET", `chapters/${m.cid}`);
    if (!r || !r.json) throw Error("empty");
    const bd = JSON.parse(r.json), c = bd.chapter;
    mergeBundle(bd, m.cid);
    chapter = { ...c, places: c.places || [], custom: c.custom || [], species: c.species || [] };
    startQuiz("chapter");
  } catch (e) {
    if (e.message === "denied") accessForm(m, box); else { box.className = "note err"; box.textContent = "Couldn't open the chapter. Check your connection and try again."; }
  }
}

function shareUI(c, code, sst, sec) {
  const msg = h("div", { class: "note", style: "margin-top:8px" }), rq = h("div");
  const setAcc = async (v) => {
    msg.className = "note"; msg.textContent = "Saving…";
    try {
      if (v === "device") {
        if (!c.share) { msg.textContent = ""; return; }
        if (!confirm("Remove this chapter from the shared directory? It stays on this device.")) { msg.textContent = ""; return; }
        if (c.share.cid) await unshare(c.share.cid);
        delete c.share; lsave();
      } else { c.share = c.share || {}; c.share.access = v; await publish(c); }
    } catch (e) { msg.className = "note err"; msg.textContent = "Couldn't publish: " + explain(e); return; }
    editChapter();
  };
  const loadReq = async () => {
    rq.textContent = "Loading…";

const USUAL = 5;
const BK = ["nelat", "nelng", "swlat", "swlng"];
const boxOk = (b) => !!b && BK.every((k) => Number.isFinite(b[k]));
const boxF = (b) => ({ nelat: b.nelat, nelng: b.nelng, swlat: b.swlat, swlng: b.swlng });
function parseBox(txt) {
  let q; try { q = new URL(txt.trim()).searchParams; } catch (e) { q = new URLSearchParams(txt.trim().replace(/^\?/, "")); }
  const b = {}; BK.forEach((k) => { b[k] = parseFloat(q.get(k)); });
  return boxOk(b) ? b : null;
}

async function checkSub(x) {
  await fix();
  const main = D.presets.find((p) => p.id === x.main), ids = main ? main.species.map((q) => q.id).filter(Boolean) : [], pl = x.places.map((p) => p.id).filter(Boolean);
  const fl = [...(pl.length ? [{ place_id: pl.join(",") }] : []), ...x.custom.filter(boxOk).map(boxF)];
  if (!ids.length || !fl.length) { x.check = null; save(); return; }
  const cnt = new Map(), g = { usual: [], rare: [], none: [] };
  for (const F of fl) {
    const d = await sf(`${API}/observations/species_counts?${new URLSearchParams({ taxon_id: ids.join(","), quality_grade: "research", per_page: "200", ...F })}`);
    (d.results || []).forEach((r) => cnt.set(r.taxon.id, (cnt.get(r.taxon.id) || 0) + r.count));
  }
  main.species.forEach((q) => { const k = cnt.get(q.id) || 0; (k >= USUAL ? g.usual : k > 0 ? g.rare : g.none).push({ id: q.id, name: q.name, common: lab(q), count: k }); });
  x.check = { places: [...x.places.map((p) => p.name), ...x.custom.filter(boxOk).map((b) => b.name)].join(", "), ...g }; x.verified = false; save();
}

    h("label", {}, "Main presets (all species that sound alike)"), chips,
    h("div", { class: "row" }, seg, h("span", { class: "note" }, "Clips per question"), num),
    h("div", { class: "row", style: "margin:16px 0 10px" }, h("span", {}, "Score: ", ui.score), ui.pool),
    ui.status, ui.card);
  refreshSubs();
  loadQ();
}

async function getPool() {
  if (pool) return pool;
  await fix();
  const c = mode === "chapter" ? chapter : null, pr = pid && (D.presets.find((p) => p.id === pid) || D.subs.find((x) => x.id === pid));
  let ids;
  if (pr) ids = pr.species.map((q) => q.id).filter((i) => i && (!c || c.species.some((y) => y.id === i)));
  else if (c) ids = c.species.map((q) => q.id).filter(Boolean);
  else ids = [AMPH];
  if (!ids.length) return (pool = []);
  const baseIds = c ? c.places.map((p) => p.id).filter(Boolean) : place && place.id ? [place.id] : [];
  const ps = pr && pr.places ? pr.places.filter((p) => p.id) : [], bx = pr && pr.custom ? pr.custom.filter(boxOk).map(boxF) : [];
  let fl = [...(baseIds.length ? [{ place_id: baseIds.join(",") }] : []), ...(c ? c.custom.filter(boxOk).map(boxF) : [])];
  if (ps.length) {
    if (!baseIds.length) fl = [{ place_id: ps.map((p) => p.id).join(",") }];
    else {
      const ba = (await Promise.all(baseIds.map(anc))).flat();
      if (!ps.some((p) => baseIds.includes(p.id) || ba.includes(p.id))) {
        const nar = [];
        for (const p of ps) if ((await anc(p.id)).some((a) => baseIds.includes(a))) nar.push(p.id);
        if (nar.length) fl = [{ place_id: nar.join(",") }];
      }
    }
  }
  if (bx.length) fl = (ps.length ? fl : []).concat(bx);
  const m = new Map();
  for (const F of fl.length ? fl : [{}]) {
    const d = await sf(`${API}/observations/species_counts?${new URLSearchParams({ taxon_id: ids.join(","), sounds: "true", quality_grade: "research", per_page: "200", ...F })}`);
    (d.results || []).map((r) => r.taxon).filter((t) => t && t.rank === "species").forEach((t) => { if (!m.has(t.id)) m.set(t.id, { ...toSp(t), fs: [] }); m.get(t.id).fs.push(F); });
  }
  return (pool = [...m.values()]);
}

async function media(tid, F) {
  const b = { taxon_id: tid, quality_grade: "research", sounds: "true", per_page: "1", ...F };
  const total = Math.min((await sf(`${API}/observations?${new URLSearchParams(b)}`)).total_results || 0, 10000);
  if (!total) return null;
  const items = [], obs = new Set(); let first = null;
  for (let a = 0; a < Math.max(n, 4) && items.length < n; a++) {
    const o = ((await sf(`${API}/observations?${new URLSearchParams({ ...b, page: Math.floor(Math.random() * total) + 1 })}`)).results || [])[0];
    if (!o || obs.has(o.id) || used.has(o.id)) continue;
    const clips = (o.sounds || []).filter((q) => q.file_url);
    if (!clips.length) continue;
    obs.add(o.id); first = first || o;
    clips.forEach((q) => { if (items.length < n) items.push({ url: q.file_url }); });
  }
  return items.length ? { items, obs: [...obs], uri: first.uri, user: (first.user && first.user.login) || "unknown" } : null;
}

const fail = (m) => { ui.status.className = "note err"; ui.status.textContent = m; };

async function loadQ() {
  const mine = ui;
  ui.card.style.display = "none"; ui.status.className = "note"; ui.status.textContent = "Loading…";
  let P;
  try { P = await getPool(); } catch (e) { fail("Couldn't reach iNaturalist. Check your connection and try again."); return; }
  if (mine !== ui) return;
  ui.pool.textContent = P.length + " species in this set";
  if (P.length < 2) { fail(pid ? "Fewer than 2 species in this preset have sound recordings here. Pick another preset or widen the area." : "Fewer than 2 species matched. Add species to this chapter or widen the area."); return; }
  const k = Math.min(10, Math.max(P.length - 2, 0)), rc = k ? recent.slice(-k) : [];
  let sp = null, res = null;
  for (let i = 0; i < 8 && !res; i++) {
    const av = P.filter((s) => !rc.includes(s.id)), pk = av.length ? av : P;
    sp = pk[Math.floor(Math.random() * pk.length)];
    try { res = await media(sp.id, sp.fs[Math.floor(Math.random() * sp.fs.length)]); } catch (e) { fail("Couldn't reach iNaturalist. Check your connection and try again."); return; }
  }
  if (!res) { fail("Couldn't find a fresh recording. Try again or widen the area."); return; }
  if (mine !== ui) return;
  res.obs.forEach((i) => used.add(i)); if (used.size > 300) used.clear();
  recent.push(sp.id);
  current = { sp, res, choices: shuf([sp, ...shuf(P.filter((s) => s.id !== sp.id)).slice(0, 3)]) };
  qn++; drawQ();
}

function drawQ() {
  const { sp, res, choices } = current, { card } = ui;
  ui.status.textContent = "";
  let fin = false;
  const fb = h("div", { class: "fb" }), nx = h("button", { class: "btn", style: "display:none", onclick: loadQ }, "Next question");
  const sk = h("button", { class: "ghost", onclick: loadQ }, "Skip bad clip");
  const end = (ok, msg) => {
    fin = true; sc.t++; if (ok) sc.c++;
    ui.score.textContent = `${sc.c} / ${sc.t}`; fb.className = "fb " + (ok ? "ok" : "bad"); fb.textContent = msg;
    nx.style.display = "inline-block"; sk.style.display = "none";
  };
  const opts = h("div", {}, choices.map((c) => h("button", { class: "opt", onclick: (e) => {
    if (fin) return;
    const ok = c.id === sp.id;
    [...opts.children].forEach((b, i) => { b.disabled = true; if (choices[i].id === sp.id) b.classList.add("ok"); });
    if (!ok) e.currentTarget.classList.add("bad");
    end(ok, ok ? `Correct — ${sp.common}.` : `Not quite. It's a ${sp.common} (${sp.name}).`);
  } }, c.common)));
  const ti = h("input", { type: "text", placeholder: "Type a common or scientific name…", autocomplete: "off" });
  const typed = () => {
    if (fin) return;
    const g = norm(ti.value), ok = !!g && (g === norm(sp.common) || g === norm(sp.name));
    ti.disabled = true;
    end(ok, ok ? `Correct — ${sp.common}.` : `Not quite — you said "${ti.value.trim() || "(nothing)"}". It's a ${sp.common} (${sp.name}).`);
  };
  ti.addEventListener("keydown", (e) => { if (e.key === "Enter") typed(); });
  card.replaceChildren(
    h("div", { class: "note" }, `Question ${qn} · Identify the call`),
    res.items.map((it, i) => h("div", { class: "clip" }, res.items.length > 1 ? h("div", { class: "note" }, `Clip ${i + 1} of ${res.items.length}`) : "", h("audio", { controls: true, src: it.url }))),
    ans === "choice" ? opts : h("div", { class: "row" }, h("div", { class: "sp" }, ti), h("button", { class: "btn", onclick: typed }, "Guess")),
    fb,
    h("div", { class: "row" }, h("span", { class: "note sp" }, `Recorded by ${res.user} · `, h("a", { href: res.uri, target: "_blank", rel: "noopener" }, "view on iNaturalist")), sk, nx));
  card.style.display = "block";
}

go(home);
fix().then((c) => { if (c && cur !== quiz) cur(); });
})();
</script>
